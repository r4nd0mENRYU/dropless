<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dropless · console</title>
<style>
  /* ============================================================
     Dropless — instrument console. Single file, no deps, offline.
     Monospace-forward "wire protocol" identity; acid-lime signal.
     ============================================================ */
  :root{
    --ink:#0a0b0e; --ink-2:#0f1116; --ink-3:#14171e; --ink-4:#191d26;
    --line:#20242e; --line-2:#2b313d;
    --text:#e7e9ee; --dim:#8b90a0; --faint:#565c6b;
    --lime:#c6f24e; --lime-dim:#9bc23a;
    --green:#8fe04a; --cyan:#54d6e6; --amber:#f1b552; --red:#f2655a; --blue:#8493b0;
    --mono:ui-monospace,"JetBrains Mono","SFMono-Regular","SF Mono","Cascadia Code",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --rail:236px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--ink); color:var(--text);
    font-family:var(--mono); font-size:13px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,.022) 1px, transparent 0),
      radial-gradient(1200px 600px at 100% -10%, rgba(198,242,78,.05), transparent 60%);
    background-size:22px 22px, 100% 100%;
  }
  a{color:inherit}
  button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
  ::selection{background:rgba(198,242,78,.28);color:#fff}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#222732;border-radius:10px;border:2px solid var(--ink)}
  ::-webkit-scrollbar-thumb:hover{background:#2c333f}

  .mut{color:var(--dim)} .fnt{color:var(--faint)}
  .mono{font-family:var(--mono)}
  .row{display:flex;align-items:center}
  .gap{gap:8px} .gap-lg{gap:16px}
  .grow{flex:1} .right{margin-left:auto}
  .nowrap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hide{display:none!important}

  /* ---- brand / signal line ---- */
  .brand{display:flex;flex-direction:column;gap:8px;padding:20px 18px 18px}
  .brand .word{font-weight:700;letter-spacing:.42em;font-size:13px;color:var(--text);
    text-indent:.42em;display:flex;align-items:center;gap:9px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--lime);
    box-shadow:0 0 0 0 rgba(198,242,78,.6);animation:beat 2.4s ease-out infinite}
  @keyframes beat{0%{box-shadow:0 0 0 0 rgba(198,242,78,.5)}70%{box-shadow:0 0 0 7px rgba(198,242,78,0)}100%{box-shadow:0 0 0 0 rgba(198,242,78,0)}}
  .signal{height:2px;border-radius:2px;background:var(--line-2);position:relative;overflow:hidden}
  .signal::after{content:"";position:absolute;inset:0;width:38%;
    background:linear-gradient(90deg,transparent,var(--lime),transparent);
    animation:sweep 3.4s linear infinite;opacity:.85}
  @keyframes sweep{0%{transform:translateX(-120%)}100%{transform:translateX(360%)}}
  .tag{font-size:9.5px;letter-spacing:.24em;color:var(--faint);text-transform:uppercase}

  /* ---- app shell ---- */
  #app{display:grid;grid-template-columns:var(--rail) 1fr;height:100vh}
  aside{background:var(--ink-2);border-right:1px solid var(--line);display:flex;flex-direction:column}
  nav{padding:8px;display:flex;flex-direction:column;gap:2px}
  .nav-i{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--dim);
    letter-spacing:.06em;border:1px solid transparent;transition:.14s;text-transform:uppercase;font-size:11px}
  .nav-i .ix{color:var(--faint);font-size:10px}
  .nav-i:hover{color:var(--text);background:var(--ink-3)}
  .nav-i.on{color:var(--ink);background:var(--lime);border-color:var(--lime);font-weight:700}
  .nav-i.on .ix{color:rgba(10,11,14,.55)}
  .conn{margin-top:auto;padding:14px 16px;border-top:1px solid var(--line);font-size:11px}
  .conn .lbl{color:var(--faint);letter-spacing:.16em;text-transform:uppercase;font-size:9px}
  .ghost{background:transparent;border:1px solid var(--line-2);border-radius:7px;padding:6px 10px;color:var(--dim);transition:.14s}
  .ghost:hover{border-color:var(--lime-dim);color:var(--text)}

  main{overflow:hidden;display:flex;flex-direction:column;min-width:0}
  .top{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px;background:linear-gradient(var(--ink-2),var(--ink))}
  .top h1{margin:0;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--text);font-weight:700}
  .top h1 b{color:var(--lime);font-weight:700}
  .live{display:inline-flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
  .led{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
  .led.off{background:var(--faint);box-shadow:none}
  .seg{display:flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
  .seg button{background:transparent;padding:6px 11px;color:var(--dim);border:0;font-size:11px;letter-spacing:.05em}
  .seg button.on{background:var(--ink-4);color:var(--lime)}

  .body{flex:1;overflow:auto;padding:18px}

  /* ---- panels / split ---- */
  .split{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;height:100%}
  @media(max-width:880px){.split{grid-template-columns:1fr}}
  .panel{background:var(--ink-2);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
  .panel-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);
    font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
  .panel-h .n{margin-left:auto;color:var(--faint);font-size:11px;letter-spacing:.04em}
  .panel-b{overflow:auto;flex:1}

  /* ---- list rows ---- */
  .li{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);
    padding:12px 14px;transition:.12s;border-left:2px solid transparent}
  .li:hover{background:var(--ink-3)}
  .li.sel{background:var(--ink-3);border-left-color:var(--lime)}
  .li .ev{font-size:12.5px;color:var(--text);font-weight:600}
  .li .meta{display:flex;gap:10px;margin-top:4px;font-size:10.5px;color:var(--faint)}
  .id{font-size:10.5px;color:var(--blue);letter-spacing:.02em}

  /* ---- status pills ---- */
  .pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 7px;border-radius:999px;
    font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid;background:rgba(255,255,255,.02)}
  .pill .pd{width:6px;height:6px;border-radius:50%;background:currentColor}
  .pill.succeeded{color:var(--green);border-color:rgba(143,224,74,.35)}
  .pill.pending{color:var(--blue);border-color:rgba(132,147,176,.35)}
  .pill.in_progress{color:var(--cyan);border-color:rgba(84,214,230,.4)}
  .pill.in_progress .pd{animation:blink 1s steps(2,start) infinite}
  .pill.failed{color:var(--amber);border-color:rgba(241,181,82,.4)}
  .pill.dead{color:var(--red);border-color:rgba(242,101,90,.4)}
  @keyframes blink{50%{opacity:.25}}

  /* ---- detail ---- */
  .detail{padding:18px}
  .detail .ttl{font-size:16px;font-weight:700;letter-spacing:.01em}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:6px 14px;margin:14px 0;font-size:12px}
  .kv dt{color:var(--faint);text-transform:uppercase;letter-spacing:.1em;font-size:10px;align-self:center}
  .kv dd{margin:0;color:var(--text);word-break:break-all}
  pre.payload{background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:12px;margin:0;
    overflow:auto;max-height:230px;font-size:11.5px;color:#cde2b4;line-height:1.6}
  .sec{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin:22px 0 10px;display:flex;align-items:center;gap:10px}
  .sec::after{content:"";flex:1;height:1px;background:var(--line)}

  .dlv{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden;background:var(--ink-3)}
  .dlv-h{display:flex;align-items:center;gap:12px;padding:11px 13px}
  .dlv-h .url{font-size:11.5px;color:var(--text)}
  .dlv-h .err{color:var(--red);font-size:11px;margin-top:3px}
  .mini{display:flex;gap:14px;font-size:10px;color:var(--faint);margin-top:5px;flex-wrap:wrap}
  .mini b{color:var(--dim);font-weight:600}
  .acts{margin-left:auto;display:flex;gap:7px}
  .btn{background:var(--ink-4);border:1px solid var(--line-2);border-radius:7px;padding:5px 11px;color:var(--text);font-size:11px;letter-spacing:.04em;transition:.14s}
  .btn:hover{border-color:var(--lime-dim)}
  .btn.go{background:var(--lime);color:var(--ink);border-color:var(--lime);font-weight:700}
  .btn.go:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.4;cursor:default}

  .tl{border-top:1px solid var(--line);padding:6px 13px 12px}
  .att{display:grid;grid-template-columns:26px 1fr auto;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);align-items:start}
  .att:last-child{border-bottom:0}
  .att .no{color:var(--faint);font-size:11px;text-align:right}
  .att .code{font-size:11px}
  .att .code .ok{color:var(--green)} .att .code .bad{color:var(--amber)}
  .att .when{color:var(--faint);font-size:10px;text-align:right;white-space:nowrap}
  .att .snip{color:var(--dim);font-size:10.5px;margin-top:3px;word-break:break-all}

  /* ---- endpoints ---- */
  .epgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .ep{background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:15px}
  .ep .u{font-size:12.5px;color:var(--text);word-break:break-all}
  .ep .st{display:flex;gap:9px;margin:11px 0 13px;flex-wrap:wrap}
  .chip{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:6px;border:1px solid var(--line-2);color:var(--dim)}
  .chip.on{color:var(--green);border-color:rgba(143,224,74,.3)}
  .chip.off{color:var(--red);border-color:rgba(242,101,90,.3)}
  .chip.cl{color:var(--green)} .chip.op{color:var(--amber)} .chip.ho{color:var(--cyan)}

  input[type=text]{background:var(--ink);border:1px solid var(--line-2);border-radius:8px;padding:9px 12px;color:var(--text);font-family:var(--mono);font-size:12.5px;width:100%;outline:none;transition:.14s}
  input[type=text]:focus{border-color:var(--lime-dim);box-shadow:0 0 0 3px rgba(198,242,78,.08)}
  input::placeholder{color:var(--faint)}

  .empty{padding:60px 20px;text-align:center;color:var(--faint)}
  .empty .big{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .empty .sub{margin-top:8px;font-size:11.5px}

  .secret{margin:14px 0 0;padding:13px 15px;border:1px solid rgba(198,242,78,.3);border-radius:10px;background:rgba(198,242,78,.05)}
  .secret .lbl{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--lime-dim)}
  .secret code{display:block;margin:7px 0 4px;color:var(--lime);font-size:12px;word-break:break-all}

  /* ---- toast ---- */
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--ink-4);border:1px solid var(--line-2);border-radius:10px;padding:11px 16px;font-size:12px;
    transition:.22s;pointer-events:none;max-width:520px;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:50}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{border-color:rgba(242,101,90,.5)} #toast.err .t{color:var(--red)}
  #toast.ok{border-color:rgba(143,224,74,.4)} #toast.ok .t{color:var(--green)}
  #toast .t{font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:10px;margin-right:8px}

  /* ---- connect gate ---- */
  #gate{position:fixed;inset:0;background:var(--ink);display:flex;align-items:center;justify-content:center;z-index:60;
    background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.025) 1px, transparent 0),radial-gradient(900px 500px at 50% 0%, rgba(198,242,78,.06), transparent 60%);background-size:22px 22px,100% 100%}
  .gate-card{width:min(440px,92vw);background:var(--ink-2);border:1px solid var(--line);border-radius:16px;padding:30px;text-align:center}
  .gate-card .word{justify-content:center;font-size:15px;margin-bottom:6px}
  .gate-card .signal{margin:14px 36px 22px}
  .gate-card h2{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:600;margin:0 0 16px}
  .gate-card .hint{margin-top:14px;font-size:10.5px;color:var(--faint);line-height:1.7}
  .gate-card .hint code{color:var(--lime-dim)}
  .stagger>*{opacity:0;animation:rise .5s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div id="gate" class="stagger">
  <div class="gate-card">
    <div class="word" style="letter-spacing:.42em"><span class="dot"></span>DROPLESS</div>
    <div class="signal"></div>
    <h2>connect to console</h2>
    <input id="gateKey" type="text" placeholder="paste API key  ·  Bearer token" autocomplete="off" spellcheck="false" />
    <div style="margin-top:14px"><button id="gateGo" class="btn go" style="width:100%;padding:10px">Authenticate</button></div>
    <div class="hint">The key is stored only in this browser (<code>localStorage</code>) and sent as<br><code>Authorization: Bearer …</code> to this same origin. Create one with<br><code>dropless create-api-key --tenant … --key …</code></div>
  </div>
</div>

<div id="app" class="hide">
  <aside>
    <div class="brand">
      <div class="word"><span class="dot"></span>DROPLESS</div>
      <div class="signal"></div>
      <div class="tag">zero-loss webhook delivery</div>
    </div>
    <nav>
      <button class="nav-i on" data-tab="messages"><span class="ix">01</span> Messages</button>
      <button class="nav-i" data-tab="endpoints"><span class="ix">02</span> Endpoints</button>
      <button class="nav-i" data-tab="consumers"><span class="ix">03</span> Consumers</button>
    </nav>
    <div class="conn">
      <div class="lbl">session</div>
      <div class="row gap" style="margin-top:7px">
        <span id="connKey" class="id grow nowrap">—</span>
        <button id="logout" class="ghost">exit</button>
      </div>
    </div>
  </aside>

  <main>
    <div class="top">
      <h1 id="title">// <b>messages</b></h1>
      <span class="live" id="liveTxt"><span class="led off" id="led"></span>idle</span>
      <div class="right row gap-lg">
        <div class="seg" id="autoSeg">
          <button data-auto="0" class="on">manual</button>
          <button data-auto="5000">auto 5s</button>
        </div>
        <button id="refresh" class="ghost">↻ refresh</button>
      </div>
    </div>
    <div class="body" id="view"></div>
  </main>
</div>

<div id="toast"><span class="t"></span><span class="m"></span></div>

<script>
"use strict";
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==="class")e.className=v;else if(x==="html")e.innerHTML=v;else if(x.startsWith("on")&&typeof v==="function")e.addEventListener(x.slice(2),v);else e.setAttribute(x,v);}for(const c of k.flat())if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(c));return e;};
const sid = id => String(id||"").slice(0,8);

const KEY = "dropless_key";
const S = { key:localStorage.getItem(KEY)||"", tab:"messages", msgs:[], sel:null, detail:null, eps:[], auto:0, timer:null, secretShown:null,
  consumers:[], selCons:null, consEps:[], consMsgs:[], consSecret:null };

// ---- api ----
async function api(path, opts={}){
  const r = await fetch(path, {...opts, headers:{ "authorization":"Bearer "+S.key, ...(opts.body?{"content-type":"application/json"}:{}), ...(opts.headers||{}) }});
  if(r.status===401){ disconnect(); throw new Error("unauthorized — reconnect"); }
  if(!r.ok){ let m=r.status+""; try{m=(await r.json()).error||m;}catch(e){} throw new Error(m); }
  if(r.status===202||r.status===204) return null;
  const ct=r.headers.get("content-type")||""; return ct.includes("json")?r.json():r.text();
}
function toast(msg, kind="ok"){ const t=$("#toast"); t.className=kind; $("#toast .t").textContent=kind==="err"?"error":"ok"; $("#toast .m").textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),3200); }
function busy(on){ $("#led").className="led"+(on?"":" off"); $("#liveTxt").lastChild.textContent=on?"  syncing":"  idle"; }

// ---- time ----
function ago(iso){ if(!iso) return "—"; const d=(Date.now()-new Date(iso))/1000; if(d<60)return Math.max(0,d|0)+"s"; if(d<3600)return (d/60|0)+"m"; if(d<86400)return (d/3600|0)+"h"; return (d/86400|0)+"d"; }
function clock(iso){ if(!iso) return "—"; return new Date(iso).toISOString().replace("T"," ").replace(/\.\d+Z/,"Z"); }
function dur(a,b){ if(!a||!b) return ""; const ms=new Date(b)-new Date(a); return ms<1000?ms+"ms":(ms/1000).toFixed(2)+"s"; }

function pill(st){ return el("span",{class:"pill "+st}, el("span",{class:"pd"}), String(st).replace("_"," ")); }

// ---- connect ----
function connect(k){ S.key=(k||"").trim(); if(!S.key) return; localStorage.setItem(KEY,S.key); $("#gate").classList.add("hide"); $("#app").classList.remove("hide"); $("#connKey").textContent="key ·"+S.key.slice(0,6)+"…"; load(); }
function disconnect(){ S.key=""; localStorage.removeItem(KEY); stopAuto(); S.detail=null; S.sel=null; $("#app").classList.add("hide"); $("#gate").classList.remove("hide"); $("#gateKey").value=""; $("#gateKey").focus(); }

// ---- navigation ----
function setTab(t){ S.tab=t; document.querySelectorAll(".nav-i").forEach(n=>n.classList.toggle("on",n.dataset.tab===t)); $("#title").innerHTML="// <b>"+t+"</b>"; load(); }

async function load(){
  busy(true);
  try{
    if(S.tab==="messages"){ S.msgs = await api("/v1/messages?limit=100"); renderMessages(); if(S.sel) openMessage(S.sel,true); }
    else if(S.tab==="consumers"){ S.consumers = await api("/v1/app"); renderConsumers(); if(S.selCons) openConsumer(S.selCons,true); }
    else { S.eps = await api("/v1/endpoints"); renderEndpoints(); }
  }catch(e){ toast(e.message,"err"); $("#view").replaceChildren(empty("transmission failed", e.message)); }
  finally{ busy(false); }
}

function empty(big,sub){ return el("div",{class:"empty"}, el("div",{class:"big"},big), sub?el("div",{class:"sub"},sub):null); }

// ---- messages view (master/detail) ----
function renderMessages(){
  const b=el("div",{class:"panel-b"});
  if(!S.msgs.length){ b.append(empty("no messages yet","POST /v1/messages to emit one")); }
  else for(const m of S.msgs){
    b.append(el("button",{class:"li"+(S.sel===m.id?" sel":""), "data-id":m.id, onclick:()=>openMessage(m.id)},
      el("div",{class:"ev nowrap"}, m.event_type),
      el("div",{class:"meta"}, el("span",{class:"id"}, sid(m.id)), el("span",{}, ago(m.created_at)+" ago"))
    ));
  }
  const list = el("div",{class:"panel"}, el("div",{class:"panel-h"}, "event stream", el("span",{class:"n"}, S.msgs.length+" shown")), b);
  const detail = el("div",{class:"panel"}, el("div",{class:"panel-h"},"delivery detail"),
    el("div",{class:"panel-b",id:"detail"}, S.detail?detailBody(S.detail):empty("select a message","attempt timelines · replay · status")));
  $("#view").replaceChildren(el("div",{class:"split"}, list, detail));
}

async function openMessage(id, quiet){
  S.sel=id;
  document.querySelectorAll(".li").forEach(b=>b.classList.toggle("sel", b.dataset.id===id));
  const host=$("#detail"); if(host&&!quiet)host.replaceChildren(empty("loading…",""));
  try{ S.detail = await api("/v1/messages/"+id); if($("#detail"))$("#detail").replaceChildren(detailBody(S.detail)); }
  catch(e){ toast(e.message,"err"); }
}

function detailBody(d){
  const wrap=el("div",{class:"detail"});
  wrap.append(el("div",{class:"ttl"}, d.event.event_type));
  const kv=el("dl",{class:"kv"});
  const addkv=(k,v)=>{ kv.append(el("dt",{},k), el("dd",{}, v)); };
  addkv("event id", el("span",{class:"id"},d.event.id));
  addkv("scope", d.event.consumer_id?el("span",{class:"id",title:d.event.consumer_id},"consumer ·"+sid(d.event.consumer_id)):el("span",{class:"fnt"},"tenant-level"));
  addkv("received", clock(d.event.created_at));
  addkv("deliveries", d.deliveries.length+"");
  wrap.append(kv);
  wrap.append(el("div",{class:"sec"},"payload"));
  wrap.append(el("pre",{class:"payload"}, JSON.stringify(d.event.payload,null,2)));
  wrap.append(el("div",{class:"sec"},"deliveries"));
  if(!d.deliveries.length) wrap.append(el("div",{class:"fnt",style:"font-size:11px"},"no active endpoints when this was emitted"));
  for(const dl of d.deliveries) wrap.append(deliveryCard(dl));
  return wrap;
}

function deliveryCard(dl){
  const card=el("div",{class:"dlv"});
  const head=el("div",{class:"dlv-h"});
  head.append(pill(dl.status));
  const info=el("div",{class:"grow",style:"min-width:0"},
    el("div",{class:"mini"},
      el("span",{}, el("b",{},"endpoint "), sid(dl.endpoint_id)),
      el("span",{}, el("b",{},"attempts "), dl.attempt_count+""),
      dl.status==="failed"?el("span",{}, el("b",{},"next "), ago(dl.next_attempt_at)): null
    ),
    dl.last_error?el("div",{class:"err nowrap",title:dl.last_error}, "⚠ "+dl.last_error):null
  );
  head.append(info);
  const acts=el("div",{class:"acts"});
  const tlBtn=el("button",{class:"btn", onclick:()=>toggleTimeline(card,dl.id,tlBtn)}, "timeline");
  const rpBtn=el("button",{class:"btn go", onclick:()=>replay(dl.id,rpBtn)}, "↻ replay");
  acts.append(tlBtn,rpBtn); head.append(acts);
  card.append(head);
  return card;
}

async function toggleTimeline(card,id,btn){
  const open=card.querySelector(".tl"); if(open){open.remove();btn.classList.remove("go");return;}
  btn.classList.add("go"); btn.disabled=true;
  try{
    const d=await api("/v1/deliveries/"+id);
    const tl=el("div",{class:"tl"});
    if(!d.attempts.length) tl.append(el("div",{class:"fnt",style:"font-size:11px;padding:6px 0"},"no attempts recorded yet"));
    for(const a of d.attempts.slice().reverse()){
      const ok = a.status_code && a.status_code>=200 && a.status_code<300;
      tl.append(el("div",{class:"att"},
        el("div",{class:"no"}, "#"+a.attempt_number),
        el("div",{},
          el("div",{class:"code"}, a.status_code?el("span",{class:ok?"ok":"bad"}, "HTTP "+a.status_code):el("span",{class:"bad"}, a.error?"transport error":"—")),
          a.error?el("div",{class:"snip"}, a.error):(a.response_snippet?el("div",{class:"snip"}, a.response_snippet):null)
        ),
        el("div",{class:"when"}, clock(a.started_at), el("div",{style:"color:var(--faint)"}, dur(a.started_at,a.finished_at)))
      ));
    }
    card.append(tl);
  }catch(e){toast(e.message,"err");btn.classList.remove("go");}
  finally{btn.disabled=false;}
}

async function replay(id,btn){
  btn.disabled=true; const old=btn.textContent; btn.textContent="…";
  try{ await api("/v1/deliveries/"+id+"/replay",{method:"POST",body:"{}"}); toast("delivery "+sid(id)+" re-queued","ok"); if(S.sel)openMessage(S.sel,true); }
  catch(e){ toast(e.message,"err"); btn.disabled=false; btn.textContent=old; }
}

// ---- endpoints view ----
function renderEndpoints(){
  const view=el("div",{});
  const urlInput=el("input",{type:"text",id:"epUrl",placeholder:"https://api.example.com/webhooks",spellcheck:"false",
    onkeydown:e=>{if(e.key==="Enter")createEndpoint();}});
  const evInput=el("input",{type:"text",id:"epEvents",spellcheck:"false",
    placeholder:"event types (optional, comma-separated):  payment.*, order.created   —  blank = ALL events",
    onkeydown:e=>{if(e.key==="Enter")createEndpoint();}});
  const form=el("div",{class:"panel",style:"margin-bottom:16px"},
    el("div",{class:"panel-h"},"register endpoint"),
    el("div",{style:"padding:14px"},
      el("div",{class:"row gap"}, urlInput,
        el("button",{class:"btn go",style:"padding:9px 16px;white-space:nowrap",onclick:createEndpoint},"+ add")),
      el("div",{style:"margin-top:8px"}, evInput),
      S.secretShown?secretBox(S.secretShown):null
    )
  );
  view.append(form);
  if(!S.eps.length){ view.append(empty("no endpoints","add one above to start fanning out deliveries")); $("#view").replaceChildren(view); return; }
  const grid=el("div",{class:"epgrid"});
  for(const e of S.eps){
    const cs=e.circuit_state;
    grid.append(el("div",{class:"ep"},
      el("div",{class:"u"}, e.url),
      el("div",{class:"st"},
        el("span",{class:"chip "+(e.disabled?"off":"on")}, e.disabled?"disabled":"enabled"),
        el("span",{class:"chip "+(cs==="closed"?"cl":cs==="open"?"op":"ho")}, "circuit "+cs),
        el("span",{class:"chip",title:e.consumer_id||"tenant-level"}, e.consumer_id?("consumer ·"+sid(e.consumer_id)):"tenant"),
        e.consecutive_failures>0?el("span",{class:"chip"}, e.consecutive_failures+" fails"):null
      ),
      el("div",{class:"mini",style:"margin:0 0 11px"},
        el("b",{},"events "),
        (e.event_types&&e.event_types.length)? e.event_types.join(", ") : "all"),
      el("div",{class:"row gap",style:"font-size:10.5px"},
        el("span",{class:"id grow nowrap",title:e.id}, sid(e.id)),
        el("button",{class:"btn",onclick:ev=>toggleEp(e,ev.target)}, e.disabled?"enable":"disable")
      )
    ));
  }
  view.append(grid);
  $("#view").replaceChildren(view);
}
function secretBox(s){ return el("div",{class:"secret"},
  el("div",{class:"lbl"},"signing secret · shown once — store it now"),
  el("code",{}, s.secret),
  el("div",{class:"row gap",style:"margin-top:6px"},
    el("span",{class:"fnt",style:"font-size:10.5px;flex:1"}, "endpoint "+sid(s.id)+" · "+s.url),
    el("button",{class:"ghost",onclick:()=>{navigator.clipboard&&navigator.clipboard.writeText(s.secret);toast("secret copied","ok");}}, "copy")
  )
); }

async function createEndpoint(){
  const inp=$("#epUrl"); const url=(inp?inp.value:"").trim(); if(!url){toast("enter a URL","err");return;}
  const evRaw=(($("#epEvents")||{}).value||"").trim();
  const event_types = evRaw ? evRaw.split(",").map(s=>s.trim()).filter(Boolean) : undefined;
  const body = event_types && event_types.length ? {url,event_types} : {url};
  try{ const r=await api("/v1/endpoints",{method:"POST",body:JSON.stringify(body)}); S.secretShown=r; S.eps=await api("/v1/endpoints"); renderEndpoints(); toast("endpoint created","ok"); }
  catch(e){ toast(e.message,"err"); }
}
async function toggleEp(e,btn,after){
  btn.disabled=true;
  try{
    await api("/v1/endpoints/"+e.id,{method:"PATCH",body:JSON.stringify({disabled:!e.disabled})});
    if(after){ await after(); }
    else { S.secretShown=null; S.eps=await api("/v1/endpoints"); renderEndpoints(); }
    toast("endpoint "+(e.disabled?"enabled":"disabled"),"ok");
  }
  catch(err){ toast(err.message,"err"); btn.disabled=false; }
}

// ---- consumers view (the application tier) ----
function renderConsumers(){
  const b=el("div",{class:"panel-b"});
  // create form
  const uidIn=el("input",{type:"text",id:"consUid",placeholder:"new consumer uid  ·  e.g. merchant_42",spellcheck:"false",
    onkeydown:e=>{if(e.key==="Enter")createConsumer();}});
  const nameIn=el("input",{type:"text",id:"consName",placeholder:"label (optional)",spellcheck:"false",
    onkeydown:e=>{if(e.key==="Enter")createConsumer();}});
  b.append(el("div",{style:"padding:13px 14px;border-bottom:1px solid var(--line)"},
    uidIn,
    el("div",{class:"row gap",style:"margin-top:8px"}, nameIn,
      el("button",{class:"btn go",style:"padding:9px 16px;white-space:nowrap",onclick:createConsumer},"+ create"))
  ));
  if(!S.consumers.length){ b.append(empty("no consumers","each is one of your tenant's end-customers")); }
  else for(const c of S.consumers){
    b.append(el("button",{class:"li"+(S.selCons===c.uid?" sel":""),"data-cid":c.uid,onclick:()=>openConsumer(c.uid)},
      el("div",{class:"ev nowrap"}, c.uid, c.name?el("span",{class:"fnt",style:"font-weight:400"}, "  ·  "+c.name):null),
      el("div",{class:"meta"},
        el("span",{}, el("b",{class:"mut"},c.endpoints+""), " endpoints"),
        el("span",{}, el("b",{class:"mut"},c.events+""), " events"),
        el("span",{}, ago(c.created_at)+" ago"))
    ));
  }
  const list=el("div",{class:"panel"}, el("div",{class:"panel-h"},"consumers", el("span",{class:"n"}, S.consumers.length+" total")), b);
  const detail=el("div",{class:"panel"}, el("div",{class:"panel-h"},"consumer detail"),
    el("div",{class:"panel-b",id:"consDetail"}, S.selCons?consumerBody():empty("select a consumer","its endpoints fan out only its own events")));
  $("#view").replaceChildren(el("div",{class:"split"}, list, detail));
}

async function openConsumer(uid, quiet){
  S.selCons=uid;
  document.querySelectorAll(".li").forEach(x=>x.classList.toggle("sel", x.dataset.cid===uid));
  const host=$("#consDetail"); if(host&&!quiet)host.replaceChildren(empty("loading…",""));
  try{
    [S.consEps,S.consMsgs]=await Promise.all([api("/v1/app/"+encodeURIComponent(uid)+"/endpoints"), api("/v1/app/"+encodeURIComponent(uid)+"/messages?limit=20")]);
    if($("#consDetail"))$("#consDetail").replaceChildren(consumerBody());
  }catch(e){ toast(e.message,"err"); }
}

function consumerBody(){
  const wrap=el("div",{class:"detail"});
  wrap.append(el("div",{class:"ttl"}, S.selCons));
  wrap.append(el("div",{class:"fnt",style:"font-size:11px;margin-top:4px"}, "publish with  POST /v1/app/"+S.selCons+"/messages  — fans out only to the endpoints below"));
  // add-endpoint form (scoped to this consumer)
  wrap.append(el("div",{class:"sec"},"endpoints"));
  const url=el("input",{type:"text",id:"consEpUrl",placeholder:"https://"+S.selCons+".example.com/webhook",spellcheck:"false",
    onkeydown:e=>{if(e.key==="Enter")createConsumerEndpoint();}});
  const ev=el("input",{type:"text",id:"consEpEvents",spellcheck:"false",placeholder:"event types (optional):  payment.*   —  blank = ALL",
    onkeydown:e=>{if(e.key==="Enter")createConsumerEndpoint();}});
  wrap.append(el("div",{style:"margin-bottom:14px"},
    el("div",{class:"row gap"}, url, el("button",{class:"btn go",style:"padding:9px 16px;white-space:nowrap",onclick:createConsumerEndpoint},"+ add")),
    el("div",{style:"margin-top:8px"}, ev),
    S.consSecret?secretBox(S.consSecret):null
  ));
  if(!S.consEps.length) wrap.append(el("div",{class:"fnt",style:"font-size:11px"},"no endpoints yet"));
  for(const e of S.consEps){
    const cs=e.circuit_state;
    wrap.append(el("div",{class:"ep",style:"margin-bottom:10px"},
      el("div",{class:"u"}, e.url),
      el("div",{class:"st"},
        el("span",{class:"chip "+(e.disabled?"off":"on")}, e.disabled?"disabled":"enabled"),
        el("span",{class:"chip "+(cs==="closed"?"cl":cs==="open"?"op":"ho")}, "circuit "+cs),
        el("span",{class:"chip"}, "events "+((e.event_types&&e.event_types.length)?e.event_types.join(", "):"all"))
      ),
      el("div",{class:"row gap",style:"font-size:10.5px"},
        el("span",{class:"id grow nowrap",title:e.id}, sid(e.id)),
        el("button",{class:"btn",onclick:ev=>toggleEp(e,ev.target,()=>openConsumer(S.selCons,true))}, e.disabled?"enable":"disable"))
    ));
  }
  // recent messages for this consumer
  wrap.append(el("div",{class:"sec"},"recent events"));
  if(!S.consMsgs.length) wrap.append(el("div",{class:"fnt",style:"font-size:11px"},"none yet"));
  for(const m of S.consMsgs){
    wrap.append(el("div",{class:"row gap",style:"padding:7px 0;border-bottom:1px solid var(--line)"},
      el("span",{class:"grow nowrap"}, m.event_type),
      el("span",{class:"id"}, sid(m.id)),
      el("span",{class:"fnt",style:"font-size:10.5px"}, ago(m.created_at)+" ago")));
  }
  return wrap;
}

async function createConsumer(){
  const uid=(($("#consUid")||{}).value||"").trim(); if(!uid){toast("enter a uid","err");return;}
  const name=(($("#consName")||{}).value||"").trim();
  try{ await api("/v1/app",{method:"POST",body:JSON.stringify(name?{uid,name}:{uid})}); S.consumers=await api("/v1/app"); S.selCons=uid; openConsumer(uid); renderConsumers(); toast("consumer "+uid+" ready","ok"); }
  catch(e){ toast(e.message,"err"); }
}
async function createConsumerEndpoint(){
  const url=(($("#consEpUrl")||{}).value||"").trim(); if(!url){toast("enter a URL","err");return;}
  const evRaw=(($("#consEpEvents")||{}).value||"").trim();
  const event_types=evRaw?evRaw.split(",").map(s=>s.trim()).filter(Boolean):undefined;
  const body=event_types&&event_types.length?{url,event_types}:{url};
  try{ const r=await api("/v1/app/"+encodeURIComponent(S.selCons)+"/endpoints",{method:"POST",body:JSON.stringify(body)}); S.consSecret=r; await openConsumer(S.selCons,true); toast("endpoint added to "+S.selCons,"ok"); }
  catch(e){ toast(e.message,"err"); }
}

// ---- auto refresh ----
function stopAuto(){ if(S.timer){clearInterval(S.timer);S.timer=null;} }
function setAuto(ms){ S.auto=ms; stopAuto(); if(ms>0)S.timer=setInterval(load,ms); }

// ---- wire up ----
document.querySelectorAll(".nav-i").forEach(n=>n.addEventListener("click",()=>setTab(n.dataset.tab)));
$("#refresh").addEventListener("click",load);
$("#logout").addEventListener("click",disconnect);
$("#gateGo").addEventListener("click",()=>connect($("#gateKey").value));
$("#gateKey").addEventListener("keydown",e=>{if(e.key==="Enter")connect($("#gateKey").value);});
$("#autoSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;[...e.currentTarget.children].forEach(c=>c.classList.toggle("on",c===b));setAuto(+b.dataset.auto);});

if(S.key) connect(S.key); else $("#gateKey").focus();
</script>
</body>
</html>
